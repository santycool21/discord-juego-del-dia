name: Juego del día

on:
  schedule:
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  recomendar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install discord.py aiohttp python-dotenv deep-translator

      - name: Crear archivo .env
        run: |
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env
          echo "TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}" >> .env
          echo "TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}" >> .env

      - name: Ejecutar bot
        run: python bot.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos.json
          git diff --cached --quiet || git commit -m "Actualizar historial de juegos"
          git push